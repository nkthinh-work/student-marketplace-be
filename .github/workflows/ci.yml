name: Backend CI & Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend Test Suite & Alembic Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student_marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations and drift check
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student_marketplace_test
        run: |
          alembic upgrade head
          alembic heads
          alembic check

      - name: Run full backend test suite
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student_marketplace_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          FIREBASE_CREDENTIALS_PATH: ""
          CLOUDINARY_CLOUD_NAME: "test"
          CLOUDINARY_API_KEY: "test"
          CLOUDINARY_API_SECRET: "test"
        run: |
          pytest tests/ -q

  docker-release-gate:
    name: Production Docker Build & Artifact Hardening Gate
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate Production Compose configuration
        run: |
          docker compose -f docker-compose.prod.yml config

      - name: Build Production Docker image
        run: |
          docker build -t student-marketplace-be:prod .

      - name: Verify non-root runtime user
        run: |
          USER_ID=$(docker run --rm student-marketplace-be:prod id -u)
          echo "Container runtime user ID: $USER_ID"
          if [ "$USER_ID" = "0" ]; then
            echo "Security violation: container runs as root!"
            exit 1
          fi

      - name: Verify Python version and dependencies
        run: |
          docker run --rm student-marketplace-be:prod python --version
          docker run --rm student-marketplace-be:prod pip check

      - name: Audit image filesystem boundaries
        run: |
          docker run --rm student-marketplace-be:prod ls -la /app
          docker run --rm student-marketplace-be:prod python -c "
          import os, sys
          forbidden = ['/app/.env', '/app/secrets', '/app/tests', '/app/backups', '/app/scratch']
          found = [p for p in forbidden if os.path.exists(p)]
          if found:
              print(f'Security failure: forbidden paths in production image: {found}')
              sys.exit(1)
          print('Production image boundary verification passed.')
          "
